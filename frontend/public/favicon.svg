<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark circle background -->
  <circle cx="50" cy="50" r="50" fill="#111827"/>

  <!-- Outer globe circle -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#facc15" stroke-width="4"/>

  <!-- Horizontal line (equator) -->
  <line x1="22" y1="50" x2="78" y2="50" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>

  <!-- Vertical center line -->
  <line x1="50" y1="22" x2="50" y2="78" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>

  <!-- Left curve -->
  <path
    d="M50 22 C38 30 34 40 34 50 C34 60 38 70 50 78"
    fill="none"
    stroke="#facc15"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Right curve -->
  <path
    d="M50 22 C62 30 66 40 66 50 C66 60 62 70 50 78"
    fill="none"
    stroke="#facc15"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>